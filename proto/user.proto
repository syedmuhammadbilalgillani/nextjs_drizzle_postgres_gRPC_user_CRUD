syntax = "proto3";

package user;

option js_package = "user";

// User resource
message User {
  int32 id = 1;
  string phone_number = 2;
  string email = 3;
  string full_name = 4;
  string profile_image = 5;
  string user_type = 6;  // "admin" | "user"
  bool is_verified = 7;
  bool is_active = 8;
  string language_preference = 9;
  string last_seen = 10;  // ISO timestamp
  string created_at = 11;
  string updated_at = 12;
}

// Input for creating a user (password required; no id/timestamps)
message CreateUserRequest {
  string phone_number = 1;
  string email = 2;
  string full_name = 3;
  string profile_image = 4;
  string user_type = 5;
  bool is_verified = 6;
  string password = 7;
  bool is_active = 8;
  string language_preference = 9;
}

message CreateUserResponse {
  User user = 1;
}

// Get user by id
message GetUserRequest {
  int32 id = 1;
}

message GetUserResponse {
  User user = 1;
}

// List users with optional pagination and search
message ListUsersRequest {
  int32 page = 1;      // 1-based
  int32 page_size = 2; // default 10
  string search = 3;   // optional: match full_name, email, or phone_number (case-insensitive)
}

message ListUsersResponse {
  repeated User users = 1;
  int32 total = 2;
}

// Update user (partial; only set fields are updated)
message UpdateUserRequest {
  int32 id = 1;
  optional string phone_number = 2;
  optional string email = 3;
  optional string full_name = 4;
  optional string profile_image = 5;
  optional string user_type = 6;
  optional bool is_verified = 7;
  optional string password = 8;
  optional bool is_active = 9;
  optional string language_preference = 10;
}

message UpdateUserResponse {
  User user = 1;
}

// Delete user
message DeleteUserRequest {
  int32 id = 1;
}

message DeleteUserResponse {
  bool success = 1;
}

service UserService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
}
